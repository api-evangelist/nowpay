aid: nowpay
name: Nowpay
description: NowPay is an employer-integrated financial wellness platform whose core
  product lets employees access their earned salary early and repay it in installments,
  positioned as a workplace benefit rather than a consumer lender. It was surfaced as
  a portfolio company of 500 Global and added to the API Evangelist network. As of this
  enrichment pass NowPay publishes only a client-rendered marketing site (nowpay.cash,
  which redirects to nowpay.com) with no public developer portal, API reference, OpenAPI,
  SDKs, or /.well-known discovery surface; every probed path returns the single-page-app
  shell. This profile therefore carries identity and a live domain-security probe only.
